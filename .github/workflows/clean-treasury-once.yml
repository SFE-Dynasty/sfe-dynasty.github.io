name: Clean treasury/index.html (one-time)
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original file
        run: git checkout 2a176d9f91f7a82b922fefc3c3938a6fb1273b1d -- treasury/index.html

      - name: Fix Moov card and strip duplicate
        run: |
          node -e "
          const fs = require('fs');
          let html = fs.readFileSync('treasury/index.html', 'utf8');
          const moovRegex = /var moovCredit=localStorage\.getItem\('moov_stco_credit'\);if\(moovCredit\)\{document\.getElementById\('moovSubledgerBalance'\)\.textContent=[^;]*;/;
          const gcat = 'GCATMWLZ7EU7EUWJ3LS6SBHKILWEUS3QBALHGF3XH4IZCOPJHFB5DJYW';
          const issuer = 'GCVDS3YYXQVFVVG4HSIBZAHQJAGMQUM6ZTJHUOQGEZHEV4VN2CX5SAT3';
          const newCode = 'fetch(\"https://horizon.stellar.org/accounts/' + gcat + '\").then(r=>r.json()).then(d=>{var b=d.balances.find(x=>x.asset_code===\"USD\"&&x.asset_issuer===\"' + issuer + '\");document.getElementById(\"moovSubledgerBalance\").textContent=b?\"$\"+parseFloat(b.balance).toLocaleString(\"en-US\",{minimumFractionDigits:2,maximumFractionDigits:2}):\"--\";}).catch(function(){document.getElementById(\"moovSubledgerBalance\").textContent=\"--\";});';
          if (moovRegex.test(html)) { html = html.replace(moovRegex, newCode); console.log('Moov: replaced'); } else { console.log('Moov: not found'); }
          const idx = html.indexOf('<\/html>');
          if (idx !== -1) { html = html.substring(0, idx + 7); console.log('Stripped to ' + html.length); }
          fs.writeFileSync('treasury/index.html', html);
          "

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add treasury/index.html
          git diff --staged --quiet && echo "No changes" || git commit -m "fix: restore original treasury dashboard + live Horizon Moov card + strip duplicate"
          git push
