name: Register Circle Entity Secret
on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set type module
        run: npm pkg set type=module

      - name: Install Circle SDK
        run: npm install @circle-fin/developer-controlled-wallets

      - name: Create .env with API key
        run: echo "CIRCLE_API_KEY=${{ secrets.CIRCLE_API_KEY }}" > .env

      - name: Run register entity secret script
        run: npx tsx register-entity-secret.ts
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}

      - name: Upload recovery file
        uses: actions/upload-artifact@v4
        with:
          name: circle-recovery-file
          path: ./recovery/
          retention-days: 7
