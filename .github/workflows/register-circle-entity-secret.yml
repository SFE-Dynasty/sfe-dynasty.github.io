name: Register Circle Entity Secret
on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set CIRCLE_API_KEY in .env
        run: echo "CIRCLE_API_KEY=${{ secrets.CIRCLE_API_KEY }}" > .env

      - name: Set type module
        run: npm pkg set type=module

      - name: Install Circle SDK
        run: npm install @circle-fin/developer-controlled-wallets

      - name: Run register entity secret
        run: npx tsx --env-file=.env register-entity-secret.ts

      - name: Upload recovery file
        uses: actions/upload-artifact@v4
        with:
          name: circle-recovery-file
          path: ./recovery/
          retention-days: 7
