name: Fix treasury/index.html
on: [workflow_dispatch]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix file
        run: |
          python3 << 'PYEOF'
          with open('treasury/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          marker = '</script></body></html>'
          cut = html.rfind(marker)
          html = html[:cut + len(marker)]
          with open('treasury/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('DONE', len(html))
          PYEOF
      - name: Commit and push
        run: |
          git config user.email "ddennis@sfemeraldtrust.com"
          git config user.name "SFE-Dynasty"
          git add treasury/index.html
          git diff --staged --quiet || git commit -m "fix: treasury/index.html - remove duplicate tail after </script></body></html>"
          git push
