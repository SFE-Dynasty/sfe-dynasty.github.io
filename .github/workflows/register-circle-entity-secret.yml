name: Register Circle Entity Secret
on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Circle SDK
        run: npm install @circle-fin/developer-controlled-wallets

      - name: Register entity secret
        env:
          CIRCLE_API_KEY: ${ { secrets.CIRCLE_API_KEY } }
        run: node --experimental-vm-modules --input-type=module --env-file=.env register-entity-secret.ts 2>&1 || npx tsx register-entity-secret.ts

      - name: Upload recovery file
        uses: actions/upload-artifact@v4
        with:
          name: circle-recovery-file
          path: ./recovery/
          retention-days: 1